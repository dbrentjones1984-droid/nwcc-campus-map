<style>
/* ===== NWCC campus map · polished dark theme (mockup 2026-10-08) ===== */
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* NWCC navy #222c62 (sampled from the official map's NORTHWEST wordmark); NWCC red #cd2230 (logo rule) */
  --navy:#222c62; --navy-deep:#1a2250; --navy-rgb:34,44,98;
  --panel:linear-gradient(180deg,rgba(38,49,108,.93),rgba(30,39,88,.93));
  --panel-strong:linear-gradient(180deg,rgba(38,49,108,.97),rgba(28,36,82,.97)); --panel-solid:#1a2250;
  --field:rgba(255,255,255,.08); --field-hover:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.13); --line-strong:rgba(255,255,255,.20);
  --text:#f3f6fc; --muted:#b7c1de; --faint:#8e99bf;
  --accent:#4f8cff; --accent-soft:rgba(110,160,255,.26); --accent-text:#e2ecff;
  --nwcc-red:#cd2230; --gold:#f2c94c;
  --r-panel:18px; --r-ctl:12px; --r-pill:999px;
  --shadow:0 10px 30px rgba(10,14,40,.40),0 2px 6px rgba(10,14,40,.28);
  --blur:saturate(140%) blur(14px);
  --gap:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);background:var(--panel-solid);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input{font-family:inherit}
#map{position:absolute;inset:0}
.glass{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--line);box-shadow:var(--shadow)}

/* ---------- header panel ---------- */
.hud{position:absolute;z-index:2;top:var(--gap);left:var(--gap);width:360px;max-width:calc(100vw - 24px);
  border-radius:var(--r-panel);overflow:hidden}
.hud .titlerow{display:flex;align-items:flex-start;gap:8px;padding:13px 8px 8px 14px}
.hud .brand{flex:1;min-width:0}
.hud .logo{display:block;height:40px;width:auto;max-width:100%;object-fit:contain;object-position:left center}
.hud .rule{height:2px;margin:9px 0 7px;border-radius:2px;background:linear-gradient(90deg,var(--nwcc-red) 0 64px,rgba(255,255,255,.14) 64px)}
.hud .eyebrow{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hud .eyebrow::before{content:"";width:12px;height:3px;border-radius:2px;background:var(--nwcc-red)}
.hud .title{margin-top:0;font-weight:700;font-size:15px;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#netdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ecf8e;margin-left:7px;vertical-align:2px;
  box-shadow:0 0 0 3px rgba(62,207,142,.16)}
#netdot.off{background:#d9a62b;box-shadow:0 0 0 3px rgba(217,166,43,.16)}
#hudToggle{flex:none;border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;
  display:grid;place-items:center;transition:transform .2s ease,background .15s}
#hudToggle svg{width:18px;height:18px}
#hudToggle:hover{background:var(--field-hover);color:var(--text)}
.hud.collapsed #hudToggle{transform:rotate(-90deg)}
.hud.collapsed .chips,.hud.collapsed .lm{display:none}

/* ---------- search ---------- */
#searchwrap{position:relative;padding:0 12px 12px}
#searchwrap .sicon{position:absolute;left:25px;top:calc(50% - 6px);transform:translateY(-50%);width:17px;height:17px;color:var(--faint);pointer-events:none}
#q{width:100%;height:42px;padding:0 40px 0 40px;border-radius:var(--r-pill);border:1px solid var(--line);
  background:var(--field);color:var(--text);font-size:14px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
#q::placeholder{color:var(--faint)}
#q::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#q:hover{background:var(--field-hover)}
#q:focus{border-color:rgba(61,126,255,.75);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(61,126,255,.18)}
#searchwrap:focus-within .sicon{color:var(--accent-text)}
#clr{position:absolute;right:20px;top:calc(50% - 6px);transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;
  background:rgba(255,255,255,.08);color:var(--muted);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center}
#clr:hover{background:rgba(255,255,255,.16);color:var(--text)}
#q:placeholder-shown ~ #clr{display:none}
#results{list-style:none;margin:0;padding:0 8px 8px;max-height:260px;overflow:auto;display:none;border-top:1px solid var(--line)}
#results.show{display:block;padding-top:6px}
#results li{display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
#results li:hover,#results li.act{background:var(--field-hover)}
#results .n{font-size:13.5px;font-weight:600;color:var(--text)}
#results .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.pinb{display:inline-flex;flex:none;min-width:32px;height:26px;padding:0 7px;align-items:center;justify-content:center;
  border-radius:8px;color:#fff;font-size:11.5px;font-weight:750;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}

/* ---------- filter chips + landmarks ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.chip{height:32px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:var(--r-pill);
  padding:0 10px 0 9px;font-size:12.5px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,opacity .15s}
.chip:hover{background:var(--field-hover)}
.chip .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.10)}
.chip .cnt{min-width:20px;height:18px;padding:0 6px;border-radius:var(--r-pill);background:rgba(255,255,255,.09);color:var(--muted);
  font-size:11px;font-weight:650;display:inline-grid;place-items:center}
.chip.off{opacity:.42}
.chip.off .dot{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--faint)}
.lm{display:flex;gap:6px;padding:2px 12px 12px;align-items:center;overflow-x:auto;scrollbar-width:none}
.lm::-webkit-scrollbar{display:none}
.lm span{flex:none;display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.lm span::first-letter{color:var(--gold)}
.lm button{flex:none;height:28px;border:1px solid rgba(242,201,76,.30);background:rgba(242,201,76,.08);color:#f5dc95;
  border-radius:var(--r-pill);padding:0 10px;font-size:12px;font-weight:650;cursor:pointer;transition:background .15s}
.lm button:hover{background:rgba(242,201,76,.18)}
#installBtn{display:none;margin:0 12px 12px;width:calc(100% - 24px);height:36px;border:1px solid var(--line);background:transparent;
  color:var(--accent-text);border-radius:var(--r-pill);font-size:12.5px;font-weight:600;cursor:pointer;
  align-items:center;justify-content:center;gap:7px}
#installBtn:hover{background:var(--accent-soft)}
#installBtn.show{display:flex}

/* ---------- right tool column ---------- */
.tools{position:absolute;z-index:2;top:var(--gap);right:var(--gap);display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:16px}
.tools button{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;
  display:grid;place-items:center;font-size:13px;font-weight:750;letter-spacing:.02em;transition:background .15s,color .15s}
.tools button svg{width:19px;height:19px}
.tools button:hover{background:var(--field-hover)}
.tools button.on{background:rgba(110,160,255,.22);color:#fff}
.tools button + button{position:relative}
.tools button + button::before{content:"";position:absolute;top:-1px;left:10px;right:10px;height:1px;background:var(--line)}
.tools button.on::before,.tools button.on + button::before{display:none}

/* ---------- MapLibre controls, dark ---------- */
.maplibregl-ctrl-bottom-right .maplibregl-ctrl,.maplibregl-ctrl-bottom-left .maplibregl-ctrl{margin:0 var(--gap) 8px 0}
.maplibregl-ctrl-group:not(:empty){background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px;overflow:hidden}
.maplibregl-ctrl-group button{width:40px;height:40px;border-radius:12px;background:transparent}
.maplibregl-ctrl-group button+button{border-top:0;position:relative}
.maplibregl-ctrl-group button+button::before{content:"";position:absolute;top:-1px;left:10px;right:10px;height:1px;background:var(--line)}
.maplibregl-ctrl-group button:not(:disabled):hover{background:var(--field-hover)}
.maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(1) hue-rotate(180deg) brightness(1.15);opacity:.9}
.maplibregl-ctrl-group button:focus:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.maplibregl-ctrl-scale{background:rgba(var(--navy-rgb),.75);border:1.5px solid var(--muted);border-top:0;color:var(--text);
  font-size:10px;font-weight:600;border-radius:0 0 4px 4px;padding:1px 6px 2px}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl{margin:0 0 10px var(--gap)}
.maplibregl-ctrl.maplibregl-ctrl-attrib{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  color:var(--muted);font-size:9.5px;line-height:20px;min-height:22px;border:1px solid var(--line);border-radius:var(--r-pill);
  margin:0 var(--gap) 8px 0!important;padding:0 9px}
.maplibregl-ctrl-attrib a{color:#c6d0e0;text-decoration:none}
.maplibregl-ctrl-attrib.maplibregl-compact{padding:0 26px 0 9px}
.maplibregl-ctrl-attrib.maplibregl-compact:not(.maplibregl-compact-show){padding:0;width:24px;min-height:24px}
.maplibregl-ctrl-attrib-button{background-color:transparent!important;filter:invert(1) brightness(.8);width:22px!important;height:22px!important;top:-1px!important;right:0!important}
@media(max-width:719px){ body .maplibregl-ctrl-bottom-left{bottom:calc(32px + env(safe-area-inset-bottom))} }  /* scale sits above the attribution row */

/* ---------- building card ---------- */
#card{position:absolute;z-index:3;display:none;overflow:hidden;background:var(--panel-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--line-strong);box-shadow:0 -8px 40px rgba(10,14,40,.45);color:var(--text)}
#card.show{display:block;animation:sheetIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
#card::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:8px auto 0}
#card .top{display:flex;gap:13px;align-items:center;padding:12px 14px 10px 16px}
#card .badge{flex:none;min-width:50px;height:50px;padding:0 8px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 82%,#fff 18%),var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000 20%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px color-mix(in srgb,var(--c) 40%,transparent)}
#card .ttl{flex:1;min-width:0}
#card h2{margin:0;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:.003em}
#card .parent{font-size:12.5px;color:var(--muted);margin-top:3px}
#card .x{flex:none;align-self:flex-start;width:32px;height:32px;margin:-2px -4px 0 0;border:0;border-radius:50%;background:rgba(255,255,255,.08);
  color:var(--muted);cursor:pointer;display:grid;place-items:center}
#card .x svg{width:15px;height:15px}
#card .x:hover{background:rgba(255,255,255,.16);color:var(--text)}
#card .body{padding:0 16px 14px}
#card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#card .tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:650;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 45%,#fff 55%);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
#card .tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
#card .lmk{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:650;
  background:rgba(242,201,76,.10);color:#f5dc95;border:1px solid rgba(242,201,76,.30)}
#card .parts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
#card .parts button{height:32px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:var(--r-pill);
  padding:0 12px;font-size:12.5px;font-weight:550;cursor:pointer}
#card .parts button:hover{background:var(--field-hover)}
#card .parts button.cur{background:var(--accent-soft);border-color:rgba(61,126,255,.6);color:var(--accent-text)}
#card .dir{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:var(--r-pill);
  background:var(--accent);color:#fff;font-size:14.5px;font-weight:650;text-decoration:none;
  box-shadow:0 6px 18px rgba(61,126,255,.35),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .15s}
#card .dir svg{width:17px;height:17px}
#card .dir:hover{filter:brightness(1.08)}
#card .dir:active{filter:brightness(.95)}
#card .sheet-attrib{display:none;padding:0 16px 10px;font-size:9.5px;color:var(--faint);text-align:center}
#card .star{display:none}

/* ---------- misc ---------- */
/* splash / loading overlay: new app icon on NWCC navy; map keeps loading underneath. app.js fades it out
   (+1 s minimum hold) once Three.js + the map are ready, then removes #loading. */
#loading{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  background:radial-gradient(120% 80% at 50% 42%,#2b377a 0%,var(--navy) 55%,var(--navy-deep) 100%);
  color:var(--muted);font-size:13px;font-weight:550;letter-spacing:.01em;text-align:center;
  opacity:1;transition:opacity .4s ease}
#loading.hide{opacity:0;pointer-events:none}
#loading .splash-icon{width:144px;height:144px;border-radius:32px;display:block;
  box-shadow:0 18px 44px rgba(6,10,32,.55),0 0 0 1px rgba(255,255,255,.10);
  animation:splashIn .6s cubic-bezier(.2,.8,.25,1) both}
#loading .splash-msg{display:flex;flex-direction:column;align-items:center;gap:10px;animation:splashFade .6s .2s ease both}
#loading .splash-bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
#loading .splash-bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,#fff,transparent);
  animation:splashBar 1.1s ease-in-out infinite}
@keyframes splashIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes splashFade{from{opacity:0}to{opacity:1}}
@keyframes splashBar{from{left:-40%}to{left:100%}}
@media(min-width:720px){#loading .splash-icon{width:160px;height:160px;border-radius:36px}}
@media(prefers-reduced-motion:reduce){#loading .splash-icon,#loading .splash-msg,#loading .splash-bar::after{animation:none}}
/* Three.js failed: overlay collapses back to the old bottom pill with the fallback message */
#loading.fallback{inset:auto auto 24px 50%;transform:translateX(-50%);z-index:2;display:block;padding:8px 14px;border-radius:var(--r-pill);
  background:var(--panel);font-size:12px;bottom:calc(24px + env(safe-area-inset-bottom))}
#loading.fallback .splash-icon,#loading.fallback .splash-bar{display:none}
#toast{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  max-width:calc(100vw - 32px);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--text);display:none;text-align:center}
#toast.show{display:block}
#toast button{margin-left:8px;border:0;border-radius:var(--r-pill);background:var(--accent);color:#fff;padding:6px 12px;font-size:12px;font-weight:650;cursor:pointer}
#selftest{display:none}

/* ---------- PWA / phone behaviour (unchanged logic) ---------- */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
body{position:fixed;inset:0}
#map{touch-action:none}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hud{top:calc(var(--gap) + env(safe-area-inset-top));left:calc(var(--gap) + env(safe-area-inset-left))}
.tools{top:calc(var(--gap) + env(safe-area-inset-top));right:calc(var(--gap) + env(safe-area-inset-right))}
.maplibregl-ctrl-bottom-right{right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom)}
.maplibregl-ctrl-bottom-left{left:env(safe-area-inset-left);bottom:env(safe-area-inset-bottom)}

/* phone: card is a bottom sheet */
@media(max-width:719px){
  .hud{width:auto;right:calc(var(--gap) + 52px + 8px + env(safe-area-inset-right));max-width:none}
  #q{font-size:16px}                         /* >=16px stops iOS Safari zooming in on focus */
  #results{max-height:38vh}
  #results li{min-height:48px}
  .chip{height:34px;font-size:13px}
  .lm button{height:32px;font-size:13px;padding:0 12px}
  #card{left:0;right:0;bottom:0;margin:0 auto;max-width:560px;border-radius:22px 22px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom);max-height:calc(62vh);max-height:calc(62dvh);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #card .x{width:36px;height:36px}
  #card .sheet-attrib{display:block}
  #card .dir{height:48px}
  body:has(#card.show) .maplibregl-ctrl-bottom-right,body:has(#card.show) .maplibregl-ctrl-bottom-left{opacity:0;pointer-events:none;transition:opacity .15s}
}
@media(pointer:coarse){
  .tools button,.maplibregl-ctrl-group button{width:44px;height:44px}
}
/* desktop: card floats left of the tool column */
@media(min-width:720px){
  #card{width:360px;right:calc(var(--gap) + 60px + env(safe-area-inset-right));top:calc(var(--gap) + env(safe-area-inset-top));
    border-radius:var(--r-panel);max-height:calc(100vh - 140px);overflow-y:auto;box-shadow:var(--shadow)}
  #card::before{display:none}
  .lm{flex-wrap:wrap;overflow:visible}
  #card .top{padding-top:16px}
}
/* COMPASS-ROSE >>> */
/* NORTHWEST compass-rose button (bottom-right, where the zoom/compass group was). The 64 px button is the hit area; the
   rose image is larger and overflows it so the N/E/S/W letters stay readable; the shadow sits on the (unrotated) button. */
.maplibregl-ctrl.nw-compass-ctrl{margin:0 calc(var(--gap) + 20px) 24px 0;pointer-events:auto}
.nw-compass{position:relative;display:block;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;
  filter:drop-shadow(0 1px 1.5px rgba(10,14,40,.45)) drop-shadow(0 3px 8px rgba(10,14,40,.25));transition:transform .15s ease,filter .15s ease;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nw-compass img{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;pointer-events:none;
  -webkit-user-select:none;user-select:none;will-change:transform}
.nw-compass:hover{transform:scale(1.07);filter:drop-shadow(0 1px 1.5px rgba(10,14,40,.5)) drop-shadow(0 4px 12px rgba(10,14,40,.35))}
.nw-compass:active{transform:scale(.93);transition-duration:.06s}
.nw-compass:focus{outline:none}
.nw-compass:focus-visible::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 2px var(--accent)}
/* attribution "i" moved to the bottom-left (scale bar removed) */
.maplibregl-ctrl-bottom-left .maplibregl-ctrl.maplibregl-ctrl-attrib{margin:0 0 8px var(--gap)!important}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib.maplibregl-compact{padding:0 9px 0 26px}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib.maplibregl-compact:not(.maplibregl-compact-show){padding:0}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib-button{left:0!important;right:auto!important}
@media(max-width:719px){ body .maplibregl-ctrl-bottom-left{bottom:env(safe-area-inset-bottom)} }
@media(pointer:coarse){ .nw-compass{width:68px;height:68px} .nw-compass img{width:108px;height:108px;margin:-54px 0 0 -54px} }
/* <<< COMPASS-ROSE */
/* CARD-PHOTO >>> */
/* building photo banner on the info card (data-driven: items with `photo`) + simple lightbox */
#card .photo{position:relative;display:block;width:calc(100% - 32px);margin:2px 16px 12px;padding:0;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;aspect-ratio:16/9;background:#1b2350;cursor:zoom-in;box-shadow:0 4px 14px rgba(5,8,30,.35)}
#card .photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transition:transform .35s ease}
#card .photo:hover img{transform:scale(1.03)}
#card .photo:active img{transform:scale(1.01)}
#card .photo:focus{outline:none}
#card .photo:focus-visible{box-shadow:0 0 0 2px var(--accent)}
#card .photo .zoom{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:rgba(12,18,52,.62);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18)}
#card .photo .zoom svg{width:14px;height:14px}
@media(max-width:719px){ #card .photo{aspect-ratio:2/1} }
#lightbox{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  background:rgba(6,9,28,.88);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#lightbox.show{display:flex;animation:lbIn .18s ease}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox figure{margin:0;max-width:min(1200px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#lightbox img{display:block;max-width:100%;max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);width:auto;height:auto;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
#lightbox figcaption{color:var(--text);font-size:14px;font-weight:650;text-align:center}
#lightbox .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel-strong);color:var(--text);display:grid;place-items:center;cursor:pointer}
#lightbox .x svg{width:16px;height:16px}
#lightbox .x:hover{background:var(--field-hover)}
/* <<< CARD-PHOTO */
</style>
</head>
<body>
<div id="map"></div>
<div class="hud glass">
  <div class="titlerow">
    <div class="brand"><img class="logo" src="assets/logo.png" alt="Northwest Mississippi Community College" width="300" height="73"/><div class="rule"></div><div class="title">NWCC Senatobia Campus<span id="netdot" title="Online"></span></div></div>
    <button id="hudToggle" aria-label="Show/hide filters" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div id="searchwrap">
    <svg class="sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="Search buildings or #" autocomplete="off" enterkeyhint="search" aria-label="Search buildings"/>
    <button id="clr" aria-label="Clear search">×</button>
  </div>
  <ul id="results" role="listbox"></ul>
  <div class="chips" id="chips"></div>
  <div class="lm" id="lm"><span>★ Landmarks</span></div>
  <button id="installBtn" type="button">⬇ Install NWCC Map on this device</button>
</div>
<div class="tools glass">
  <button id="tHome" title="Fit campus" aria-label="Fit campus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg></button>
  <button id="tTilt" title="Toggle 3D tilt" aria-label="Toggle 3D tilt">2D</button>
  <button id="tSpin" title="Orbit slowly" aria-label="Orbit slowly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5A8 8 0 1 1 17.7 6"/><path d="M20.5 3.5V8h-4.5"/></svg></button>
  <button id="tLabels" title="Toggle labels" aria-label="Toggle labels">Aa</button>
</div>
<div id="card" role="dialog" aria-live="polite"></div>
<div id="loading" role="status" aria-live="polite">
  <img class="splash-icon" src="icons/icon-512.png" alt="NWCC Campus Map" width="160" height="160" decoding="async"/>
  <div class="splash-msg"><span id="loadingMsg">Loading 3D exteriors…</span><div class="splash-bar" aria-hidden="true"></div></div>
</div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<pre id="selftest"></pre>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
